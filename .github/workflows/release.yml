name: Release

# Runs whenever a version tag (v0.5.6, v0.6.0, ...) is pushed. Builds an
# installer on both Windows and macOS runners and publishes them together
# to a GitHub Release matching the tag — that release is what the app's
# built-in auto-updater (electron-updater) checks against.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      # electron-builder's GitHub publish step creates the release for a
      # tag if one doesn't exist yet, then uploads that platform's assets
      # to it. Running both platforms in parallel means both can try to
      # create it at the same moment — usually one just finds the other
      # already made it and carries on, but occasionally the race lands
      # badly and one job fails outright with a 422 "already_exists"
      # error (seen on v0.5.13). max-parallel: 1 trades a bit of wall-clock
      # time for never hitting that race at all.
      max-parallel: 1
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npx electron-vite build

      - run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The two Adobe Premiere panels, attached to every release as their own zips so
  # they can be downloaded without cloning the repo. They keep the same file name
  # every release, so ".../releases/latest/download/<name>.zip" is always current.
  extensions:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip the extensions
        run: |
          mkdir dist-extensions
          zip -r dist-extensions/BijouMusic-Premiere-Panel.zip premiere-extension
          # Installable package (double-click it): the panel's own version follows the
          # release, so Creative Cloud sees each one as an update to the last.
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" premiere-extension/manifest.json
          (cd premiere-extension && zip -r ../dist-extensions/BijouMusic-Premiere-Panel.ccx . -x 'README.md' -x '*.backup-*')
          cp -r premiere-cep-extension com.bijoumusic.cutsilence
          zip -r dist-extensions/BijouMusic-Premiere-CutSilence.zip com.bijoumusic.cutsilence

      - name: Attach to the release
        run: gh release upload "${{ github.ref_name }}" dist-extensions/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
