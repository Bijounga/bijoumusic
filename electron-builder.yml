appId: com.ibrahim.bijoumusic
productName: BijouMusic
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
asarUnpack:
  - resources/**
extraResources:
  - from: build/icon.png
    to: build/icon.png
win:
  executableName: bijoumusic
  icon: build/icon.ico
  target: portable
npmRebuild: false
